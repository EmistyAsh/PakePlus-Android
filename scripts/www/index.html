<!DOCTYPE html>

    <style id="theme-vars">
/* Family Seasons Album — warm neutral + amber primary */
:root {
  --album-bg: #faf8f5;
  --album-surface: #ffffff;
  --album-surface-2: #f5f1eb;
  --album-ink: #2c2420;
  --album-ink-2: #6b5f57;
  --album-ink-3: #9e9289;
  --album-line: #e8e0d7;
  --album-brand: #c17f45;
  --album-brand-ink: #ffffff;
  --album-muted: #f3efe9;
  --album-muted-ink: #7a6f66;
  --album-ring: #c17f45;

  --album-radius-sm: 4px;
  --album-radius-md: 8px;
  --album-radius-lg: 16px;

  --album-shadow-1: 0 1px 2px rgba(44, 36, 32, 0.05), 0 1px 1px rgba(44, 36, 32, 0.03);
  --album-shadow-2: 0 8px 24px -8px rgba(44, 36, 32, 0.18);

  --album-font: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}

@theme inline {
  --color-background: var(--album-bg);
  --color-foreground: var(--album-ink);
  --color-card: var(--album-surface);
  --color-card-foreground: var(--album-ink);
  --color-popover: var(--album-surface);
  --color-popover-foreground: var(--album-ink);
  --color-primary: var(--album-brand);
  --color-primary-foreground: var(--album-brand-ink);
  --color-muted: var(--album-muted);
  --color-muted-foreground: var(--album-muted-ink);
  --color-border: var(--album-line);
  --color-input: var(--album-line);
  --color-ring: var(--album-ring);
  --radius-sm: var(--album-radius-sm);
  --radius-md: var(--album-radius-md);
  --radius-lg: var(--album-radius-lg);
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] { display: inline-flex; align-items: center; justify-content: center; }
      .album-reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.7s cubic-bezier(0.3, 0, 0, 1), transform 0.7s cubic-bezier(0.3, 0, 0, 1); }
      .album-reveal.visible { opacity: 1; transform: translateY(0); }
      .photo-card { transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s cubic-bezier(0.2, 0.8, 0.2, 1); }
      .photo-card:hover { transform: translateY(-4px); box-shadow: var(--album-shadow-2); }
      .photo-card img { transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
      .photo-card:hover img { transform: scale(1.03); }
      @media (prefers-reduced-motion: reduce) {
        .album-reveal { transition: none; }
        .photo-card, .photo-card img { transition: none; }

    <script>
        lucide.createIcons();
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
        document.querySelectorAll('.album-reveal:not(.visible)').forEach(el => observer.observe(el));
    </script>
